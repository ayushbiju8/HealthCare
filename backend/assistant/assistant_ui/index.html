<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Medical Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7fb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --sidebar-width: 380px;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-dark); height: 100vh; overflow: hidden; }

        .layout { display: flex; height: 100vh; width: 100%; transition: all 0.3s ease; }

        /* Main Content Area */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; transition: all 0.3s ease; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; font-weight: 700; color: var(--text-dark); }
        .toggle-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: var(--border-radius); font-weight: 600; cursor: pointer; transition: background 0.2s; box-shadow: var(--shadow); }
        .toggle-btn:hover { background: var(--primary-hover); }

        .reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .report-card { background: var(--white); border-radius: var(--border-radius); padding: 20px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s ease; box-shadow: var(--shadow); }
        .report-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .report-card.active { border-color: var(--primary); }
        .report-card h3 { font-size: 18px; margin-bottom: 8px; }
        .report-card p { color: var(--text-muted); font-size: 14px; }

        .report-details { background: var(--white); border-radius: var(--border-radius); padding: 30px; box-shadow: var(--shadow); flex-grow: 1; display: none; }
        .report-details.visible { display: block; animation: fadeIn 0.4s ease; }
        .report-details h2 { margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        
        .results-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .results-table th, .results-table td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .results-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-normal { background: #dcfce7; color: #166534; }
        .status-high { background: #fee2e2; color: #991b1b; }
        .status-low { background: #fef9c3; color: #854d0e; }

        /* Sidebar AI Assistant */
        .ai-sidebar { width: var(--sidebar-width); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; transform: translateX(0); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -4px 0 15px rgba(0,0,0,0.05); }
        .ai-sidebar.collapsed { transform: translateX(100%); margin-right: calc(var(--sidebar-width) * -1); }
        
        .sidebar-header { padding: 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: var(--white); }
        .sidebar-header h2 { font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

        .system-alerts { padding: 15px; background: #fee2e2; color: #991b1b; font-size: 13px; font-weight: 600; display: none; }

        .chat-window { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; animation: slideIn 0.3s ease; }
        .message p { margin-bottom: 8px; }
        .message p:last-child { margin-bottom: 0; }
        .message ul, .message ol { margin-left: 24px; margin-bottom: 8px; padding-left: 0; }
        .message li { margin-bottom: 4px; }
        .msg-user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 4px; }
        .msg-user p { color: white; }
        .msg-ai { align-self: flex-start; background: #f1f5f9; color: var(--text-dark); border-bottom-left-radius: 4px; }

        .chat-input-area { padding: 20px; background: var(--white); border-top: 1px solid #e2e8f0; }
        .input-wrapper { display: flex; gap: 10px; }
        .chat-input { flex: 1; border: 1px solid #cbd5e1; border-radius: 20px; padding: 12px 16px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .chat-input:focus { border-color: var(--primary); }
        .send-btn { background: var(--primary); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.2s; }
        .send-btn:hover { transform: scale(1.05); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .loading { display: none; align-self: flex-start; color: var(--text-muted); font-size: 13px; font-style: italic; }
    </style>
</head>
<body>

    <div class="layout">
        <!-- Main Dashboard -->
        <main class="main-content">
            <div class="header">
                <h1>Patient Dashboard</h1>
                <div style="display: flex; gap: 10px;">
                    <input type="file" id="report-upload" accept="application/pdf,image/jpeg,image/png" style="display: none;" onchange="handleFileUpload(event)">
                    <button class="toggle-btn" style="background: #10b981;" onclick="document.getElementById('report-upload').click()">
                        📤 Upload Report
                    </button>
                    <button class="toggle-btn" onclick="toggleSidebar()">
                        ✨ AI Health Assistant
                    </button>
                </div>
            </div>

            <div class="reports-grid" id="reports-grid">
                <!-- Report cards injected via JS -->
            </div>

            <div class="report-details" id="report-details">
                <h2 id="detail-title">Select a report</h2>
                <p id="detail-meta" style="color: var(--text-muted); margin-bottom: 20px;"></p>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Test Name</th>
                            <th>Value</th>
                            <th>Reference Range</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="detail-table-body">
                        <!-- Table rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </main>

        <!-- AI Assistant Sidebar -->
        <aside class="ai-sidebar collapsed" id="ai-sidebar">
            <div class="sidebar-header">
                <h2><span>🤖</span> CareBot AI</h2>
                <button class="close-btn" onclick="toggleSidebar()">×</button>
            </div>
            
            <div class="system-alerts" id="system-alerts"></div>

            <div class="chat-window" id="chat-window">
                <!-- Chat messages injected via JS -->
            </div>
            <div class="loading" id="loading-indicator" style="padding: 0 20px;">AI is thinking...</div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Ask about your report..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const sidebar = document.getElementById('ai-sidebar');
        const reportsGrid = document.getElementById('reports-grid');
        const reportDetails = document.getElementById('report-details');
        const detailTitle = document.getElementById('detail-title');
        const detailMeta = document.getElementById('detail-meta');
        const detailTableBody = document.getElementById('detail-table-body');
        
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const loadingIndicator = document.getElementById('loading-indicator');
        const systemAlerts = document.getElementById('system-alerts');

        let allReports = [];
        let selectedReport = null;

        // Toggle sidebar
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        // Fetch reports on load
        async function fetchReports() {
            try {
                const response = await fetch('http://localhost:5000/api/reports');
                const data = await response.json();
                allReports = data.reports || [];
                renderReportsGrid();
                
                // Auto-select the first report if available
                if(allReports.length > 0) {
                    selectReport(allReports[0]);
                }
            } catch (err) {
                console.error("Error fetching reports:", err);
            }
        }

        // Handle file upload
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Show global loading state
            detailTitle.innerText = "Parsing report with AI OCR... Please wait.";
            detailMeta.innerText = "This usually takes 5-10 seconds.";
            detailTableBody.innerHTML = "";
            reportDetails.classList.add('visible');
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('http://localhost:5000/api/upload_report', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (data.success) {
                    // Refetch all reports to update the grid
                    await fetchReports();
                    // It will auto-select the newest report (which is the first one in the list since it's ordered by date DESC)
                } else {
                    alert("Error uploading report: " + data.error);
                    detailTitle.innerText = "Select a report";
                    detailMeta.innerText = "";
                }
            } catch (error) {
                console.error("Upload failed", error);
                alert("Upload failed. Is the server running?");
            }
            
            // Clear input
            event.target.value = '';
        }

        // Render report cards
        function renderReportsGrid() {
            reportsGrid.innerHTML = '';
            allReports.forEach(report => {
                const card = document.createElement('div');
                card.className = `report-card ${selectedReport && selectedReport.report_id === report.report_id ? 'active' : ''}`;
                card.onclick = () => selectReport(report);
                card.innerHTML = `
                    <h3>Report: ${report.date_of_report}</h3>
                    <p>ID: ${report.report_id}</p>
                `;
                reportsGrid.appendChild(card);
            });
        }

        // Display selected report details
        async function selectReport(report) {
            selectedReport = report;
            renderReportsGrid(); // Update active state
            
            reportDetails.classList.add('visible');
            detailTitle.innerText = `Medical Report - ${report.date_of_report}`;
            detailMeta.innerText = `Patient: ${report.name} (ID: ${report.patient_id}) | Age: ${report.age}`;
            
            detailTableBody.innerHTML = '';
            report.test_results.forEach(test => {
                const tr = document.createElement('tr');
                let badgeClass = 'status-normal';
                if (test.status.toLowerCase() === 'high') badgeClass = 'status-high';
                if (test.status.toLowerCase() === 'low') badgeClass = 'status-low';

                tr.innerHTML = `
                    <td><strong>${test.test_name}</strong></td>
                    <td>${test.value} ${test.unit}</td>
                    <td>${test.reference_range}</td>
                    <td><span class="status-badge ${badgeClass}">${test.status}</span></td>
                `;
                detailTableBody.appendChild(tr);
            });
            
            // Generate alerts for the selected report
            const alerts = [];
            report.test_results.forEach(test => {
                if (['low', 'high', 'abnormal'].includes(test.status.toLowerCase())) {
                    alerts.push(`Alert: ${test.test_name} is ${test.status} (${test.value} ${test.unit}).`);
                }
            });
            
            if (alerts.length > 0) {
                systemAlerts.style.display = 'block';
                systemAlerts.innerHTML = "<strong>CRITICAL ALERTS:</strong><br>" + alerts.join("<br>");
            } else {
                systemAlerts.style.display = 'none';
                systemAlerts.innerHTML = "";
            }
            
            // Clear chat window and fetch history
            chatWindow.innerHTML = '';
            loadingIndicator.style.display = 'block';
            
            try {
                const response = await fetch(`http://localhost:5000/api/chat/history?patient_id=${report.patient_id}&report_id=${report.report_id}`);
                const data = await response.json();
                
                if (data.history && data.history.length > 0) {
                    data.history.forEach(msg => {
                        const typeClass = msg.role === 'user' ? 'msg-user' : 'msg-ai';
                        addMessage(typeClass, msg.content);
                    });
                } else {
                    // Default greeting if no history
                    addMessage('msg-ai', `I'm now looking at your report from **${report.date_of_report}**. What would you like to know?`);
                }
            } catch (error) {
                console.error("Error fetching chat history:", error);
                addMessage('msg-ai', `I'm now looking at your report from **${report.date_of_report}**. What would you like to know?`);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // Chat Functionality
        function addMessage(typeClass, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${typeClass}`;
            // Use marked.js to parse markdown (bold, lists, newlines)
            msgDiv.innerHTML = marked.parse(text);
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage('msg-user', text);
            chatInput.value = '';
            loadingIndicator.style.display = 'block';

            // We pass the currently selected report as the context
            const payload = {
                message: text,
                report: selectedReport
            };

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.response) {
                    addMessage('msg-ai', data.response);
                } else if (data.error) {
                    addMessage('msg-ai', `Error: ${data.error}`);
                }

                if (data.alerts && data.alerts.length > 0) {
                    systemAlerts.style.display = 'block';
                    systemAlerts.innerHTML = "<strong>CRITICAL ALERTS:</strong><br>" + data.alerts.join("<br>");
                } else {
                    systemAlerts.style.display = 'none';
                    systemAlerts.innerHTML = "";
                }

            } catch (error) {
                addMessage('msg-ai', 'Failed to connect to the server.');
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        // Initialize
        fetchReports();
    </script>
</body>
</html>
